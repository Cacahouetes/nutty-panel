name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check for changesets
        id: changesets
        run: |
          if [ -z "$(ls -A .changeset/unreleased 2>/dev/null)" ]; then
            echo "no-changesets=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR for changesets
        if: steps.changesets.outputs.no-changesets != 'true'
        uses: changesets/action@v1.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}