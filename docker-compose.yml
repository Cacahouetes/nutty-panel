---
# Nutty Panel - Infrastructure

services:
  # Backend API + Docker orchestration
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.server
    container_name: nutty-panel-api
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - PANEL_ADMIN_EMAIL=${PANEL_ADMIN_EMAIL:-admin@nutty.panel}
      - PANEL_ADMIN_PASSWORD=${PANEL_ADMIN_PASSWORD}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./data:/app/data
      - ./servers:/app/servers
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Frontend SPA (nginx)
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.client
    container_name: nutty-panel-web
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - api

  # Reverse proxy with automatic HTTPS (Caddy / Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    container_name: nutty-panel-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PANEL_DOMAIN=${PANEL_DOMAIN:-:80}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config: